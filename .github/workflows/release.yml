name: Release

# Two ways in, one path out:
#   - Run this workflow from the Actions tab, pick major/minor/patch, and it
#     works out the next version from the newest v* tag and creates the tag.
#   - Or keep pushing tags by hand (`git tag v1.3.3 && git push origin v1.3.3`);
#     the version is read straight off the tag.
# Either way the same job stamps version-name, builds the bundle and publishes.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to increment'
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags: ['v*']

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need the full tag list to find the newest version

      - name: Refuse to release off master
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
        run: |
          echo "::error::Releases are cut from master, not ${GITHUB_REF#refs/heads/}"
          exit 1

      - name: Work out the version
        id: compute
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            # Tag push: the tag is the version.
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LATEST="$(git tag -l 'v*' --sort=-v:refname | head -1)"
            LATEST="${LATEST:-v0.0.0}"
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
            echo "Newest tag $LATEST + $BUMP -> v$VERSION"
          fi

          # EGO's version-name rule is /^(?!^[. ]+$)[a-zA-Z0-9 .]{1,16}$/, and a
          # plain semver tag is the only shape this repo has ever used. Reject
          # anything else here rather than at upload time.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a MAJOR.MINOR.PATCH version"
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" != 'push' ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing v$VERSION"

  build:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      version-name: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ultrawide-shortcuts@lukewilde.co.uk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # On a dispatch run this is what creates the tag; on a tag push it
          # just reuses the tag that triggered the run.
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: ultrawide-shortcuts@lukewilde.co.uk.zip
