name: Package Extension

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # release.yml calls this so the lint/zip/validate steps live in exactly one
  # place — a drifted shexli pin or bundle command would otherwise only bite
  # on a real release.
  workflow_call:
    inputs:
      version-name:
        description: 'Semver string stamped into metadata.json as version-name'
        type: string
        default: ''

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  package:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version-name
        if: inputs.version-name != ''
        env:
          VERSION_NAME: ${{ inputs.version-name }}
        run: |
          # Only the release bundle carries a version-name; the checked-in
          # metadata.json stays version-less so the symlinked dev install and
          # the git tag can never disagree. EGO owns the integer `version`
          # field, so we never write that one.
          jq --arg v "$VERSION_NAME" '.["version-name"] = $v' metadata.json > metadata.tmp
          mv metadata.tmp metadata.json
          cat metadata.json

      - name: Create ZIP
        run: |
          # File list lives in bundle-files.txt so CI and ./dev.sh ego can't drift.
          zip ultrawide-shortcuts@lukewilde.co.uk.zip -@ < bundle-files.txt

      - name: Validate bundle (shexli)
        run: |
          # shexli 0.2.1 asks for tree-sitter>=0.25.0 with no upper bound, but the
          # newest tree-sitter-javascript (0.25.0) is built against the 0.25 ABI.
          # Letting pip pick tree-sitter 0.26 segfaults the parser, so pin the core.
          python3 -m pip install --quiet shexli==0.2.1 "tree-sitter<0.26"
          shexli ultrawide-shortcuts@lukewilde.co.uk.zip

          # shexli exits 0 even when it reports errors, so gate on the JSON status
          # instead — these are the same rules EGO runs against an upload.
          shexli --format json ultrawide-shortcuts@lukewilde.co.uk.zip > shexli.json
          if [ "$(jq -r '.summary.status' shexli.json)" != "clean" ]; then
            echo "::error::shexli found $(jq -rc '.summary.severity_counts' shexli.json) — see the report above"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultrawide-shortcuts@lukewilde.co.uk
          path: ultrawide-shortcuts@lukewilde.co.uk.zip
